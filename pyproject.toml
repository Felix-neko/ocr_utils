[project]
name = "ocr-utils"
version = "0.1.0"
description = "Postprocess PDF magazine scans: split spreads into pages, add high-quality OCR layer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.25",
    "ocrmypdf>=16",
    "pillow>=10",
    "click>=8.0",
    "deskew>=1.5",
    "pikepdf>=9.0",
    "numpy>=1.24",
    "torch>=2.6",
    "surya-ocr>=0.17.1",
    "transformers>=4.57,<5.0",
    "requests>=2.34.2",
    #    "paddlepaddle-gpu>=3.0.0",
    #    "paddlex[ocr]>=3.4.3",
    #    "eynollah[ocr]==0.8.0",
    "docling>=2.95.0",
    "python-doctr[torch]>=1.0.1",
    "ocrd>=3.0",
    "ocrd-anybaseocr>=1.8.0",
    "ocrd-segment>=0.2.0",
    "lxml>=5.0",
]

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle" }

[project.scripts]
ocr-utils = "ocr_utils.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
magic_trailing_comma = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
