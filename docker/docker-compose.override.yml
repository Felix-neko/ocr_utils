# Наложение поверх cvat-src/docker-compose.yml.
#
# Зачем всё это:
#   * На машине может быть другой CVAT из апстрим-compose, который жёстко
#     задаёт name: cvat, container_name: cvat_* и тома cvat_cvat_*. Чтобы наш
#     стек не сталкивался с ним и не писал в чужую БД, мы даём проекту своё имя
#     (cvat_mts) и переименовываем контейнеры в cvat_mts_*. Тома и сеть тогда
#     тоже получают префикс cvat_mts_ автоматически.
#   * Монтируем папку с картинками (IMAGES_DIR) в /home/django/share (ro) —
#     чтобы заводить задачи «из share» без загрузки файлов через браузер.
#   * Отключаем прожорливую аналитику (grafana + vector) через профиль.
#     ClickHouse оставлен: от него depends_on сервер и воркеры (убрать нельзя),
#     но простаивающий он почти ничего не ест.

name: cvat_mts

x-share: &share
  type: bind
  source: ${IMAGES_DIR}
  target: /home/django/share
  read_only: true

services:
  cvat_db:
    container_name: cvat_mts_db

  cvat_redis_inmem:
    container_name: cvat_mts_redis_inmem

  cvat_redis_ondisk:
    container_name: cvat_mts_redis_ondisk

  cvat_server:
    container_name: cvat_mts_server
    environment:
      CVAT_ANALYTICS: 0
      # Модуль настроек с доверенными origin'ами для раздачи через туннель — см. сам файл.
      # В образе DJANGO_SETTINGS_MODULE зашит на этапе сборки, поэтому переопределяем прямо
      # переменной, а не через CVAT_CONFIGURATION.
      DJANGO_SETTINGS_MODULE: cvat.settings.tunnel
      # Свой домен туннеля добавляется сюда; список целиком заменяет умолчание из файла.
      # CVAT_CSRF_TRUSTED_ORIGINS: https://*.ru.tuna.am,http://localhost:8081
    volumes:
      - *share
      - type: bind
        # Путь начинается с ../ не по ошибке: docker compose разрешает относительные пути
        # от --project-directory, а он у нас cvat-src (см. up.sh), а не папка этого файла.
        source: ../cvat_settings_tunnel.py
        target: /home/django/cvat/settings/tunnel.py
        read_only: true
    labels:
      # Маршрут БЕЗ привязки к имени хоста — см. пояснение у cvat_ui ниже.
      traefik.http.routers.cvat.rule: >-
        PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`)
        || PathPrefix(`/django-rq`)

  cvat_worker_utils:
    container_name: cvat_mts_worker_utils
    volumes:
      - *share

  cvat_worker_import:
    container_name: cvat_mts_worker_import
    volumes:
      - *share

  cvat_worker_export:
    container_name: cvat_mts_worker_export
    environment:
      CVAT_ANALYTICS: 0
    volumes:
      - *share

  cvat_worker_annotation:
    container_name: cvat_mts_worker_annotation
    volumes:
      - *share

  cvat_worker_webhooks:
    container_name: cvat_mts_worker_webhooks

  cvat_worker_quality_reports:
    container_name: cvat_mts_worker_quality_reports

  cvat_worker_chunks:
    container_name: cvat_mts_worker_chunks
    volumes:
      - *share

  cvat_worker_consensus:
    container_name: cvat_mts_worker_consensus

  cvat_ui:
    container_name: cvat_mts_ui
    labels:
      # ЛЮБОЕ имя хоста, а не только localhost.
      #
      # В апстриме оба маршрута начинаются с Host(`${CVAT_HOST}`), то есть traefik пускает
      # внутрь только запросы с этим именем. Запрос через туннель (Tuna, ngrok и подобные)
      # приходит с чужим Host, не совпадает ни с одним правилом, и traefik отвечает
      # «404 page not found» — при живом и здоровом CVAT за ним. Диагностируется одной
      # строкой: curl -H 'Host: чужое-имя' http://localhost:8081/ даёт 404, а с
      # Host: localhost — 200.
      #
      # Django здесь ни при чём: ALLOWED_HOSTS в апстрим-compose уже '*'.
      #
      # Приоритет маршрутов traefik определяет по длине правила, поэтому PathPrefix(`/`)
      # у интерфейса не перехватывает /api/ — правило сервера длиннее и выигрывает.
      #
      # Плата за это — CVAT становится доступен по любому имени, каким его ни позвали. При
      # раздаче наружу это и требуется, но тогда всё, что защищает данные, — пароли из .env.
      traefik.http.routers.cvat-ui.rule: PathPrefix(`/`)

  cvat_opa:
    container_name: cvat_mts_opa

  cvat_clickhouse:
    container_name: cvat_mts_clickhouse

  traefik:
    container_name: cvat_mts_traefik
    environment:
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: cvat_mts_cvat
      # Доверять заголовкам X-Forwarded-* от того, кто стоит впереди (туннель Tuna, ngrok).
      #
      # Без этого traefik их ПЕРЕЗАПИСЫВАЕТ по своей точке входа, то есть ставит
      # X-Forwarded-Proto: http. Django с USE_X_FORWARDED_HOST и SECURE_PROXY_SSL_HEADER
      # тогда считает, что запрос пришёл по http, а браузер прислал Origin: https://... —
      # и проверка CSRF валится с «Origin checking failed ... does not match any trusted
      # origins». Именно это видно в интерфейсе как «Could not send logs to the server».
      #
      # insecure означает «верить заголовкам от кого угодно»: порт 8081 слушает весь мир,
      # и подделать X-Forwarded-Proto может любой. Для локального стенда, который раздают
      # через туннель, это осознанный размен — иначе туннель не работает вовсе.
      TRAEFIK_ENTRYPOINTS_WEB_FORWARDEDHEADERS_INSECURE: "true"
    # !override — заменяем список портов целиком (иначе compose дописал бы
    # к базовым 8080/8090 ещё и наш маппинг). Дашборд-порт 8090 не нужен.
    ports: !override
      - ${CVAT_PORT:-8080}:8080

  # Аналитика — в профиль, чтобы не стартовала (на неё никто не depends_on).
  cvat_vector:
    profiles: ["analytics"]

  cvat_grafana:
    profiles: ["analytics"]
